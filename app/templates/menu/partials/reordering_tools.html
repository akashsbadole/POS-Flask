<!-- Reordering Tools Component -->
<div class="reorder-tools" x-show="showTools" x-transition>
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">
            <svg class="w-5 h-5 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
            Reordering Tools
        </h3>
        <button @click="$parent.showTools = false" 
                class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Quick Actions -->
        <div class="bg-white rounded-lg p-4 border border-gray-200">
            <h4 class="font-medium text-gray-900 mb-3">Quick Actions</h4>
            <div class="space-y-2">
                <button @click="resetToAlphabetical()" 
                        class="w-full text-left px-3 py-2 text-sm bg-gray-50 hover:bg-gray-100 rounded-md transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                    Reset to Alphabetical
                </button>
                <button @click="sortByPrice()" 
                        class="w-full text-left px-3 py-2 text-sm bg-gray-50 hover:bg-gray-100 rounded-md transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Sort by Price
                </button>
                <button @click="sortByPreparationTime()" 
                        class="w-full text-left px-3 py-2 text-sm bg-gray-50 hover:bg-gray-100 rounded-md transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Sort by Prep Time
                </button>
            </div>
        </div>
        
        <!-- Bulk Operations -->
        <div class="bg-white rounded-lg p-4 border border-gray-200">
            <h4 class="font-medium text-gray-900 mb-3">Bulk Operations</h4>
            <div class="space-y-2">
                <button @click="toggleBulkMode()" 
                        :class="bulkMode ? 'bg-blue-50 text-blue-700' : 'bg-gray-50 hover:bg-gray-100'"
                        class="w-full text-left px-3 py-2 text-sm rounded-md transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    <span x-text="bulkMode ? 'Exit Bulk Mode' : 'Bulk Select'"></span>
                </button>
                <button @click="moveSelectedItems()" 
                        :disabled="!bulkMode || selectedItems.length === 0"
                        class="w-full text-left px-3 py-2 text-sm bg-gray-50 hover:bg-gray-100 rounded-md transition-colors flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4 4"></path>
                    </svg>
                    Move Selected Items
                </button>
                <button @click="duplicateSelectedItems()" 
                        :disabled="!bulkMode || selectedItems.length === 0"
                        class="w-full text-left px-3 py-2 text-sm bg-gray-50 hover:bg-gray-100 rounded-md transition-colors flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Duplicate Selected
                </button>
            </div>
        </div>
        
        <!-- View Options -->
        <div class="bg-white rounded-lg p-4 border border-gray-200">
            <h4 class="font-medium text-gray-900 mb-3">View Options</h4>
            <div class="space-y-2">
                <button @click="togglePreviewMode()" 
                        :class="previewMode ? 'bg-blue-50 text-blue-700' : 'bg-gray-50 hover:bg-gray-100'"
                        class="w-full text-left px-3 py-2 text-sm rounded-md transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <span x-text="previewMode ? 'Exit Preview' : 'Preview Order'"></span>
                </button>
                <button @click="toggleCompactView()" 
                        :class="compactView ? 'bg-blue-50 text-blue-700' : 'bg-gray-50 hover:bg-gray-100'"
                        class="w-full text-left px-3 py-2 text-sm rounded-md transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                    </svg>
                    <span x-text="compactView ? 'Expand View' : 'Compact View'"></span>
                </button>
                <button @click="exportOrder()" 
                        class="w-full text-left px-3 py-2 text-sm bg-gray-50 hover:bg-gray-100 rounded-md transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Export Order
                </button>
            </div>
        </div>
    </div>
    
    <!-- Status Bar -->
    <div class="mt-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
        <div class="flex items-center justify-between text-sm">
            <div class="flex items-center space-x-4">
                <span class="text-gray-600">
                    Total Items: <span class="font-medium text-gray-900" x-text="totalItems"></span>
                </span>
                <span x-show="bulkMode" class="text-gray-600">
                    Selected: <span class="font-medium text-blue-600" x-text="selectedItems.length"></span>
                </span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-gray-600">Last saved:</span>
                <span class="font-medium text-gray-900" x-text="lastSaved || 'Never'"></span>
            </div>
        </div>
    </div>
</div>

<!-- Floating Action Button -->
<div class="fixed bottom-6 right-6 z-40">
    <button @click="showTools = !showTools"
            :class="showTools ? 'bg-gray-600' : 'bg-blue-600'"
            class="bg-blue-600 text-white p-3 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:scale-105">
        <svg x-show="!showTools" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
        </svg>
        <svg x-show="showTools" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>
