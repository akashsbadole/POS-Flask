<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for addon in addons %}
    {% include 'menu/partials/addon_card.html' %}
    {% endfor %}
</div>

{% if not addons %}
<div class="text-center py-8">
    <i class="fas fa-plus-circle text-4xl text-gray-400 mb-3"></i>
    <h3 class="text-lg font-medium text-gray-900 mb-1">No add-ons found</h3>
    <p class="text-gray-500 mb-4">Get started by creating your first add-on</p>
    <button @click="htmx.get('{{ url_for('menu.create_addon') }}')"
            class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
        <i class="fas fa-plus mr-2"></i>Add New Add-on
    </button>
</div>
{% endif %}
