<div class="border rounded-lg p-4 {% if not category.is_active %}opacity-60{% endif %}">
    <div class="flex justify-between items-start mb-2">
        <h3 class="text-lg font-medium text-gray-900">{{ category.name }}</h3>
        <span class="{% if category.is_active %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %} inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium">
            {% if category.is_active %}Active{% else %}Inactive{% endif %}
        </span>
    </div>
    
    {% if category.description %}
    <p class="text-sm text-gray-600 mb-3">{{ category.description }}</p>
    {% endif %}
    
    <div class="flex justify-between items-center mb-3">
        <span class="text-lg font-bold text-blue-600">
            {{ category.addon_count }} add-on{{ 's' if category.addon_count != 1 else '' }}
        </span>
        <span class="text-xs text-gray-400">Order: {{ category.display_order }}</span>
    </div>
    
    <div class="flex justify-between items-center">
        <div class="flex space-x-2">
            <a href="{{ url_for('menu.edit_addon_category', category_id=category.id) }}"
               class="text-blue-600 hover:text-blue-900 text-sm">
                Edit
            </a>
            <form method="POST" action="{{ url_for('menu.delete_addon_category', category_id=category.id) }}"
                  class="inline"
                  onsubmit="return confirm('Are you sure you want to delete this category?')">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit"
                        class="text-red-600 hover:text-red-900 text-sm">
                    Delete
                </button>
            </form>
        </div>
    </div>
</div>
