<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for category in categories %}
    {% include 'menu/partials/addon_category_item.html' %}
    {% endfor %}
</div>

{% if not categories %}
<div class="text-center py-8">
    <i class="fas fa-folder-plus text-4xl text-gray-400 mb-3"></i>
    <h3 class="text-lg font-medium text-gray-900 mb-1">No categories found</h3>
    <p class="text-gray-500 mb-4">Get started by creating your first add-on category</p>
    <button @click="htmx.get('{{ url_for('menu.create_addon_category') }}')"
            class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
        <i class="fas fa-plus mr-2"></i>Add New Category
    </button>
</div>
{% endif %}
