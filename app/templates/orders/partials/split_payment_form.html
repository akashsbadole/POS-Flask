<div class="bg-white rounded-lg shadow-sm border p-4" x-data="{ 
    paymentMethods: [
        { method: 'cash', amount: 0 },
        { method: 'card', amount: 0 }
    ],
    balanceDue: {{ order.get_balance_due() }},
    totalAllocated: 0,
    
    get remainingBalance() {
        return this.balanceDue - this.totalAllocated;
    },
    
    updateTotal() {
        this.totalAllocated = this.paymentMethods.reduce((sum, payment) => sum + payment.amount, 0);
    },
    
    addPaymentMethod() {
        if (this.paymentMethods.length < 4) {
            this.paymentMethods.push({ method: 'upi', amount: 0 });
        }
    },
    
    removePaymentMethod(index) {
        if (this.paymentMethods.length > 1) {
            this.paymentMethods.splice(index, 1);
            this.updateTotal();
        }
    },
    
    setMaxAmount(index) {
        this.paymentMethods[index].amount = this.remainingBalance;
        this.updateTotal();
    }
}" x-init="updateTotal()">
    
    <h3 class="text-lg font-semibold mb-4">Split Payment</h3>
    
    <div class="mb-4 p-3 bg-gray-50 rounded-lg">
        <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">Balance Due:</span>
            <span class="text-lg font-bold text-gray-900">${{ "%.2f"|format(order.get_balance_due()) }}</span>
        </div>
        <div class="flex justify-between items-center mt-1">
            <span class="text-sm font-medium text-gray-700">Allocated:</span>
            <span class="text-sm font-bold" 
                  :class="remainingBalance >= 0 ? 'text-green-600' : 'text-red-600'">
                $<span x-text="totalAllocated.toFixed(2)"></span>
            </span>
        </div>
        <div class="flex justify-between items-center mt-1">
            <span class="text-sm font-medium text-gray-700">Remaining:</span>
            <span class="text-sm font-bold" 
                  :class="remainingBalance >= 0 ? 'text-blue-600' : 'text-red-600'">
                $<span x-text="remainingBalance.toFixed(2)"></span>
            </span>
        </div>
    </div>
    
    <form method="POST" action="{{ url_for('orders.process_split_payment', order_id=order.id) }}"
          hx-post="{{ url_for('orders.process_split_payment', order_id=order.id) }}"
          hx-target="#order-totals"
          hx-swap="innerHTML">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="space-y-3 mb-4">
            <template x-for="(payment, index) in paymentMethods" :key="index">
                <div class="flex items-center space-x-2 p-3 bg-gray-50 rounded-lg">
                    <select :name="`payment_method[]`" 
                            x-model="payment.method"
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="cash">Cash</option>
                        <option value="card">Card</option>
                        <option value="upi">UPI</option>
                        <option value="wallet">Wallet</option>
                        <option value="gift_card">Gift Card</option>
                    </select>
                    
                    <div class="relative">
                        <input type="number" 
                               :name="`payment_amount[]`"
                               x-model="payment.amount"
                               @input="updateTotal()"
                               step="0.01"
                               min="0"
                               :max="remainingBalance + payment.amount"
                               class="w-32 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <span class="text-gray-500 text-sm">$</span>
                        </div>
                    </div>
                    
                    <button type="button" 
                            @click="setMaxAmount(index)"
                            class="px-3 py-2 bg-blue-100 text-blue-700 rounded-md hover:bg-blue-200 text-sm font-medium">
                        Max
                    </button>
                    
                    <button type="button" 
                            @click="removePaymentMethod(index)"
                            x-show="paymentMethods.length > 1"
                            class="px-3 py-2 bg-red-100 text-red-700 rounded-md hover:bg-red-200 text-sm font-medium">
                        Remove
                    </button>
                </div>
            </template>
        </div>
        
        <div class="flex space-x-2 mb-4">
            <button type="button" 
                    @click="addPaymentMethod()"
                    x-show="paymentMethods.length < 4"
                    class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 text-sm">
                Add Payment Method
            </button>
        </div>
        
        <div class="flex space-x-3">
            <button type="submit" 
                    :disabled="remainingBalance > 0.01 || totalAllocated <= 0"
                    class="flex-1 bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 disabled:bg-gray-400 disabled:cursor-not-allowed">
                Process Split Payment
            </button>
            <button type="button" 
                    onclick="this.closest('.bg-white').style.display='none'"
                    class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
                Cancel
            </button>
        </div>
        
        <div x-show="remainingBalance > 0.01" class="mt-3 p-2 bg-yellow-50 border border-yellow-200 rounded-md">
            <p class="text-sm text-yellow-800">
                <span class="font-medium">Note:</span> You must allocate the full balance due ($<span x-text="remainingBalance.toFixed(2)"></span>) to process the payment.
            </p>
        </div>
    </form>
</div>
