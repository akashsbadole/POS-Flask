<div class="bg-white rounded-lg shadow-sm border p-4" x-data="{ discountType: 'percentage' }">
    <h3 class="text-lg font-semibold mb-4">Apply Discount</h3>
    
    {% if order.discount_amount > 0 %}
    <div class="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-sm font-medium text-green-800">Current Discount</p>
                <p class="text-xs text-green-600">{{ order.discount_type }}: ${{ "%.2f"|format(order.discount_amount) }}</p>
                {% if order.discount_reason %}
                <p class="text-xs text-green-600">Reason: {{ order.discount_reason }}</p>
                {% endif %}
            </div>
            <form method="POST" action="{{ url_for('orders.remove_discount', order_id=order.id) }}" 
                  hx-post="{{ url_for('orders.remove_discount', order_id=order.id) }}"
                  hx-target="#order-totals"
                  hx-swap="innerHTML">
                <button type="submit" class="text-red-600 hover:text-red-800 text-sm font-medium">
                    Remove
                </button>
            </form>
        </div>
    </div>
    {% else %}
    <form method="POST" action="{{ url_for('orders.apply_discount', order_id=order.id) }}"
          hx-post="{{ url_for('orders.apply_discount', order_id=order.id) }}"
          hx-target="#order-totals"
          hx-swap="innerHTML">
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Discount Type</label>
                <div class="flex space-x-4">
                    <label class="flex items-center">
                        <input type="radio" name="discount_type" value="percentage" 
                               x-model="discountType" checked
                               class="mr-2 text-blue-600 focus:ring-blue-500">
                        <span class="text-sm">Percentage (%)</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="discount_type" value="fixed" 
                               x-model="discountType"
                               class="mr-2 text-blue-600 focus:ring-blue-500">
                        <span class="text-sm">Fixed Amount ($)</span>
                    </label>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    <span x-show="discountType === 'percentage'">Discount Percentage</span>
                    <span x-show="discountType === 'fixed'">Discount Amount</span>
                </label>
                <div class="relative">
                    <input type="number" 
                           name="discount_value" 
                           step="0.01"
                           min="0"
                           {% if discountType == 'percentage' %}max="100"{% endif %}
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                           required>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <span x-show="discountType === 'percentage'" class="text-gray-500 text-sm">%</span>
                        <span x-show="discountType === 'fixed'" class="text-gray-500 text-sm">$</span>
                    </div>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Reason (Optional)</label>
                <input type="text" 
                       name="discount_reason" 
                       placeholder="e.g., Customer complaint, Staff discount"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="flex space-x-3">
                <button type="submit" 
                        class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Apply Discount
                </button>
                <button type="button" 
                        onclick="this.closest('.bg-white').style.display='none'"
                        class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
                    Cancel
                </button>
            </div>
        </div>
    </form>
    {% endif %}
</div>
