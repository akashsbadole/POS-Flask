<!-- PIN Login Form -->
<div class="bg-white py-8 px-6 shadow rounded-lg">
    <div class="text-center mb-6">
        <h3 class="text-lg font-medium text-gray-900">Quick Login</h3>
        <p class="mt-1 text-sm text-gray-600">
            Use your 4-digit PIN for fast access
        </p>
    </div>

    <form method="POST" action="{{ url_for('auth.pin_login') }}"
          hx-post="{{ url_for('auth.pin_login') }}"
          hx-target="#pin-form-container"
          hx-swap="innerHTML"
          id="pin-form-container"
          class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <!-- PIN Input -->
        <div>
            <label for="pin" class="block text-sm font-medium text-gray-700">
                PIN Code
            </label>
            <div class="mt-1">
                <input id="pin"
                       name="pin"
                       type="password"
                       maxlength="4"
                       pattern="[0-9]{4}"
                       inputmode="numeric"
                       placeholder="0000"
                       required
                       class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-center text-lg font-mono">
            </div>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div class="rounded-md bg-red-50 p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-circle text-red-400"></i>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">
                        {{ error }}
                    </h3>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Submit Button -->
        <div>
            <button type="submit"
                    class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                    <i class="fas fa-keypad text-green-500 group-hover:text-green-400"></i>
                </span>
                Login with PIN
            </button>
        </div>
    </form>
</div>
