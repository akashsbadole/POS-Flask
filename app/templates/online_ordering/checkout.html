{% extends "online_ordering/base.html" %}

{% block title %}Checkout{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto" x-data="checkoutManager()">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">Checkout</h1>
        <p class="text-xl text-gray-600">Complete your order details</p>
    </div>

    <!-- Order Summary -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-2xl font-semibold text-gray-900 mb-4">Order Summary</h2>
        
        <div class="space-y-4">
            <template x-for="(item, key) in cartItems" :key="key">
                <div class="border-b pb-4 last:border-b-0">
                    <div class="flex items-start space-x-4">
                        <!-- Item Image -->
                        <div class="w-16 h-16 bg-gray-200 rounded-lg flex-shrink-0">
                            {% if item.image_url %}
                            <img :src="item.image_url || '/static/images/placeholder-food.jpg'" 
                                 :alt="item.item_name" 
                                 class="w-full h-full object-cover rounded-lg">
                            {% else %}
                            <div class="w-full h-full bg-gray-200 rounded-lg flex items-center justify-center">
                                <i class="fas fa-utensils text-xl text-gray-400"></i>
                            </div>
                            {% endif %}
                        </div>
                        
                        <!-- Item Details -->
                        <div class="flex-1">
                            <h3 class="font-semibold text-lg text-gray-900 mb-1" x-text="item.item_name"></h3>
                            
                            <!-- Variant and Add-ons -->
                            <div x-show="item.variant_name" class="text-sm text-gray-600 mb-1">
                                <span x-text="item.variant_name"></span>
                            </div>
                            
                            <div x-show="item.add_ons && item.add_ons.length > 0" class="text-sm text-gray-600 mb-1">
                                <span class="font-medium">Add-ons:</span>
                                <template x-for="add_on in item.add_ons">
                                    <span x-text="add_on.name + (add_on.price > 0 ? ' (+$' + add_on.price.toFixed(2) + ')' : '')"></span>
                                </template>
                            </div>
                            
                            <div x-show="item.notes" class="text-sm text-gray-600 mb-2">
                                <span class="font-medium">Notes:</span> <span x-text="item.notes"></span>
                            </div>
                            
                            <!-- Price and Quantity -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <span class="text-sm text-gray-600">Unit Price:</span>
                                    <span class="font-semibold" x-text="'$' + item.unit_price.toFixed(2)"></span>
                                </div>
                                
                                <div class="flex items-center space-x-3">
                                    <span class="text-sm text-gray-600">Quantity:</span>
                                    <span class="font-semibold" x-text="item.quantity"></span>
                                </div>
                                
                                <div class="text-right">
                                    <p class="font-semibold text-lg" x-text="'$' + (item.unit_price * item.quantity).toFixed(2)"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Order Totals -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-2xl font-semibold text-gray-900 mb-4">Order Totals</h2>
        
        <div class="space-y-2">
            <div class="flex justify-between">
                <span class="text-gray-600">Subtotal:</span>
                <span class="font-semibold" x-text="'$' + subtotal.toFixed(2)"></span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-600">Tax (8.75%):</span>
                <span class="font-semibold" x-text="'$' + tax.toFixed(2)"></span>
            </div>
            <div class="border-t pt-2">
                <div class="flex justify-between text-lg">
                    <span class="font-semibold">Total:</span>
                    <span class="font-bold text-blue-600" x-text="'$' + total.toFixed(2)"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Customer Information -->
    <form method="POST" @submit="processCheckout($event)">
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-900 mb-4">Customer Information</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">
                        First Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" 
                           id="first_name" 
                           name="first_name" 
                           x-model="customerInfo.first_name"
                           value="{{ customer.first_name or '' }}"
                           required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">
                        Last Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" 
                           id="last_name" 
                           name="last_name" 
                           x-model="customerInfo.last_name"
                           value="{{ customer.last_name or '' }}"
                           required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           x-model="customerInfo.email"
                           value="{{ customer.email or '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                        Phone Number
                    </label>
                    <input type="tel" 
                           id="phone" 
                           name="phone" 
                           x-model="customerInfo.phone"
                           value="{{ customer.phone or '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Delivery Options -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-900 mb-4">Delivery Options</h2>
            
            <div class="space-y-4">
                <div class="flex items-center">
                    <input type="radio" 
                           id="pickup" 
                           name="delivery_type" 
                           value="pickup"
                           x-model="deliveryType"
                           class="mr-3">
                    <label for="pickup" class="text-gray-700 cursor-pointer">
                        <i class="fas fa-store mr-2"></i>
                        Pickup
                    </label>
                </div>
                
                <div class="flex items-center">
                    <input type="radio" 
                           id="delivery" 
                           name="delivery_type" 
                           value="delivery"
                           x-model="deliveryType"
                           class="mr-3">
                    <label for="delivery" class="text-gray-700 cursor-pointer">
                        <i class="fas fa-truck mr-2"></i>
                        Delivery
                    </label>
                </div>
            </div>
            
            <!-- Delivery Address (shown when delivery is selected) -->
            <div x-show="deliveryType === 'delivery'" x-cloak class="mt-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Delivery Address</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label for="address_line1" class="block text-sm font-medium text-gray-700 mb-2">
                            Address Line 1 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" 
                               id="address_line1" 
                               name="address_line1" 
                               x-model="deliveryAddress.address_line1"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="address_line2" class="block text-sm font-medium text-gray-700 mb-2">
                            Address Line 2
                        </label>
                        <input type="text" 
                               id="address_line2" 
                               name="address_line2" 
                               x-model="deliveryAddress.address_line2"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label for="city" class="block text-sm font-medium text-gray-700 mb-2">
                            City <span class="text-red-500">*</span>
                        </label>
                        <input type="text" 
                               id="city" 
                               name="city" 
                               x-model="deliveryAddress.city"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label for="postal_code" class="block text-sm font-medium text-gray-700 mb-2">
                            Postal Code <span class="text-red-500">*</span>
                        </label>
                        <input type="text" 
                               id="postal_code" 
                               name="postal_code" 
                               x-model="deliveryAddress.postal_code"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>
        </div>

        <!-- Order Notes -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-900 mb-4">Order Notes</h2>
            
            <label for="order_notes" class="block text-sm font-medium text-gray-700 mb-2">
                Special Instructions
            </label>
            <textarea id="order_notes" 
                      name="order_notes" 
                      x-model="orderNotes"
                      rows="4"
                      placeholder="Any special requests or delivery instructions..."
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
            <button type="submit" 
                    :disabled="isProcessing"
                    class="bg-green-600 text-white px-8 py-3 rounded-lg hover:bg-green-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <span x-show="!isProcessing">
                    <i class="fas fa-credit-card mr-2"></i>
                    Place Order
                </span>
                <span x-show="isProcessing">
                    <i class="fas fa-spinner fa-spin mr-2"></i>
                    Processing...
                </span>
            </button>
        </div>
    </form>
</div>

<script>
function checkoutManager() {
    return {
        cartItems: {{ cart|tojson }},
        subtotal: {{ subtotal|tojson }},
        tax: {{ tax|tojson }},
        total: {{ total|tojson }},
        deliveryType: 'pickup',
        customerInfo: {
            first_name: '{{ customer.first_name or "" }}',
            last_name: '{{ customer.last_name or "" }}',
            email: '{{ customer.email or "" }}',
            phone: '{{ customer.phone or "" }}'
        },
        deliveryAddress: {
            address_line1: '',
            address_line2: '',
            city: '',
            postal_code: ''
        },
        orderNotes: '',
        isProcessing: false,
        
        processCheckout(event) {
            event.preventDefault();
            
            // Validate required fields
            if (!this.customerInfo.first_name || !this.customerInfo.last_name) {
                this.showNotification('Please enter your first and last name', 'error');
                return;
            }
            
            if (this.deliveryType === 'delivery') {
                if (!this.deliveryAddress.address_line1 || !this.deliveryAddress.city || !this.deliveryAddress.postal_code) {
                    this.showNotification('Please complete delivery address', 'error');
                    return;
                }
            }
            
            this.isProcessing = true;
            
            // Submit form
            event.target.submit();
        },
        
        showNotification(message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} mr-2"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    }
}
</script>
{% endblock %}
