{% extends "online_ordering/base.html" %}

{% block title %}Shopping Cart{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto" x-data="cartManager()">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">Shopping Cart</h1>
        <p class="text-xl text-gray-600">Review your order before checkout</p>
    </div>

    <!-- Cart Items -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <div x-show="Object.keys(cartItems).length === 0" class="text-center py-12">
            <i class="fas fa-shopping-cart text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-600 text-lg mb-4">Your cart is empty</p>
            <a href="{{ url_for('online_ordering.menu') }}" 
               class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-utensils mr-2"></i>
                Browse Menu
            </a>
        </div>

        <div x-show="Object.keys(cartItems).length > 0">
            <div class="space-y-4">
                <template x-for="(item, key) in cartItems" :key="key">
                    <div class="border-b pb-4 last:border-b-0">
                        <div class="flex items-start space-x-4">
                            <!-- Item Image -->
                            <div class="w-20 h-20 bg-gray-200 rounded-lg flex-shrink-0">
                                {% if item.image_url %}
                                <img :src="item.image_url || '/static/images/placeholder-food.jpg'" 
                                     :alt="item.item_name" 
                                     class="w-full h-full object-cover rounded-lg">
                                {% else %}
                                <div class="w-full h-full bg-gray-200 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-utensils text-2xl text-gray-400"></i>
                                </div>
                                {% endif %}
                            </div>
                            
                            <!-- Item Details -->
                            <div class="flex-1">
                                <h3 class="font-semibold text-lg text-gray-900 mb-1" x-text="item.item_name"></h3>
                                
                                <!-- Variant and Add-ons -->
                                <div x-show="item.variant_name" class="text-sm text-gray-600 mb-1">
                                    <span x-text="item.variant_name"></span>
                                </div>
                                
                                <div x-show="item.add_ons && item.add_ons.length > 0" class="text-sm text-gray-600 mb-1">
                                    <span class="font-medium">Add-ons:</span>
                                    <template x-for="add_on in item.add_ons">
                                        <span x-text="add_on.name + (add_on.price > 0 ? ' (+$' + add_on.price.toFixed(2) + ')' : '')"></span>
                                    </template>
                                </div>
                                
                                <div x-show="item.notes" class="text-sm text-gray-600 mb-2">
                                    <span class="font-medium">Notes:</span> <span x-text="item.notes"></span>
                                </div>
                                
                                <!-- Price and Quantity -->
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <span class="text-sm text-gray-600">Unit Price:</span>
                                        <span class="font-semibold" x-text="'$' + item.unit_price.toFixed(2)"></span>
                                    </div>
                                    
                                    <div class="flex items-center space-x-3">
                                        <span class="text-sm text-gray-600">Quantity:</span>
                                        <div class="flex items-center space-x-2">
                                            <button @click="updateQuantity(key, item.quantity - 1)" 
                                                    class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center transition-colors"
                                                    :disabled="item.quantity <= 1">
                                                <i class="fas fa-minus text-xs"></i>
                                            </button>
                                            <span class="w-8 text-center font-semibold" x-text="item.quantity"></span>
                                            <button @click="updateQuantity(key, item.quantity + 1)" 
                                                    class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center transition-colors">
                                                <i class="fas fa-plus text-xs"></i>
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div class="text-right">
                                        <p class="font-semibold text-lg" x-text="'$' + (item.unit_price * item.quantity).toFixed(2)"></p>
                                    </div>
                                    
                                    <button @click="removeItem(key)" 
                                            class="text-red-600 hover:text-red-800 transition-colors ml-4">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Summary -->
    <div x-show="Object.keys(cartItems).length > 0" class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-xl font-semibold text-gray-900 mb-4">Order Summary</h2>
        
        <div class="space-y-2">
            <div class="flex justify-between">
                <span class="text-gray-600">Subtotal:</span>
                <span class="font-semibold" x-text="'$' + subtotal.toFixed(2)"></span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-600">Tax (8.75%):</span>
                <span class="font-semibold" x-text="'$' + tax.toFixed(2)"></span>
            </div>
            <div class="border-t pt-2">
                <div class="flex justify-between text-lg">
                    <span class="font-semibold">Total:</span>
                    <span class="font-bold text-blue-600" x-text="'$' + total.toFixed(2)"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div x-show="Object.keys(cartItems).length > 0" class="flex flex-col sm:flex-row gap-4">
        <button @click="clearCart()" 
                class="flex-1 bg-gray-200 text-gray-800 px-6 py-3 rounded-lg hover:bg-gray-300 transition-colors">
            <i class="fas fa-trash-alt mr-2"></i>
            Clear Cart
        </button>
        <button @click="continueShopping()" 
                class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
            <i class="fas fa-arrow-left mr-2"></i>
            Continue Shopping
        </button>
        <button @click="proceedToCheckout()" 
                class="flex-1 bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors">
            <i class="fas fa-credit-card mr-2"></i>
            Proceed to Checkout
        </button>
    </div>
</div>

<script>
function cartManager() {
    return {
        cartItems: {{ cart|tojson }},
        subtotal: {{ subtotal|tojson }},
        tax: {{ tax|tojson }},
        total: {{ total|tojson }},
        
        updateQuantity(key, quantity) {
            if (quantity < 1) return;
            
            const formData = new FormData();
            formData.append('cart_key', key);
            formData.append('quantity', quantity);
            
            fetch('{{ url_for("online_ordering.update_cart") }}', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Reload page to show updated cart
                    location.reload();
                }
            })
            .catch(error => {
                console.error('Error updating cart:', error);
                this.showNotification('Error updating cart', 'error');
            });
        },
        
        removeItem(key) {
            if (!confirm('Remove this item from cart?')) return;
            
            const formData = new FormData();
            formData.append('cart_key', key);
            formData.append('quantity', '0');
            
            fetch('{{ url_for("online_ordering.update_cart") }}', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Reload page to show updated cart
                    location.reload();
                }
            })
            .catch(error => {
                console.error('Error removing item:', error);
                this.showNotification('Error removing item', 'error');
            });
        },
        
        clearCart() {
            if (!confirm('Clear all items from cart?')) return;
            
            fetch('{{ url_for("online_ordering.clear_cart") }}', {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Reload page to show empty cart
                    location.reload();
                }
            })
            .catch(error => {
                console.error('Error clearing cart:', error);
                this.showNotification('Error clearing cart', 'error');
            });
        },
        
        continueShopping() {
            window.location.href = '{{ url_for("online_ordering.menu") }}';
        },
        
        proceedToCheckout() {
            window.location.href = '{{ url_for("online_ordering.checkout") }}';
        },
        
        showNotification(message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} mr-2"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    }
}
</script>
{% endblock %}
