<!-- HTMX Live Polling Component -->
<div x-data="livePollManager('{{ endpoint }}', {{ interval|default(10) }}, '{{ target_id }}')" 
     x-init="initPolling()"
     class="live-poll-container">
    
    <!-- Polling Controls -->
    <div class="flex items-center justify-between mb-2" x-show="showControls">
        <div class="flex items-center space-x-2">
            <!-- Polling Status Indicator -->
            <div class="flex items-center">
                <div class="w-2 h-2 rounded-full mr-2" 
                     :class="{
                         'bg-green-500': isPolling && !hasError,
                         'bg-yellow-500': isPolling && hasError,
                         'bg-gray-400': !isPolling
                     }"
                     x-show="isPolling"></div>
                <span class="text-xs text-gray-600" x-text="statusText"></span>
            </div>
            
            <!-- Last Update Time -->
            <span class="text-xs text-gray-500" x-show="lastUpdate">
                Last updated: <span x-text="formatTime(lastUpdate)"></span>
            </span>
        </div>
        
        <!-- Control Buttons -->
        <div class="flex items-center space-x-1">
            <!-- Polling Interval Selector -->
            <select x-model="pollingInterval" 
                    @change="updatePollingInterval()"
                    class="text-xs border border-gray-300 rounded px-2 py-1">
                <option value="5">5s</option>
                <option value="10">10s</option>
                <option value="30">30s</option>
                <option value="60">1min</option>
            </select>
            
            <!-- Pause/Resume Button -->
            <button @click="togglePolling()" 
                    :disabled="!isInitialized"
                    class="text-xs px-2 py-1 rounded border"
                    :class="{
                        'bg-red-100 text-red-700 border-red-300 hover:bg-red-200': isPolling,
                        'bg-green-100 text-green-700 border-green-300 hover:bg-green-200': !isPolling
                    }">
                <span x-show="isPolling">⏸️ Pause</span>
                <span x-show="!isPolling">▶️ Resume</span>
            </button>
            
            <!-- Refresh Button -->
            <button @click="refreshNow()" 
                    :disabled="isLoading"
                    class="text-xs px-2 py-1 bg-blue-100 text-blue-700 border border-blue-300 rounded hover:bg-blue-200">
                🔄 Refresh
            </button>
        </div>
    </div>
    
    <!-- Loading Indicator -->
    <div x-show="isLoading" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         class="flex items-center justify-center py-2">
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-500 mr-2"></div>
        <span class="text-xs text-gray-600">Updating...</span>
    </div>
    
    <!-- Error Message -->
    <div x-show="hasError" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded text-xs mb-2">
        <span class="flex items-center">
            <span class="mr-1">⚠️</span>
            <span x-text="errorMessage"></span>
        </span>
    </div>
    
    <!-- Success Notification -->
    <div x-show="showSuccess" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-95"
         class="bg-green-50 border border-green-200 text-green-700 px-3 py-2 rounded text-xs mb-2">
        <span class="flex items-center">
            <span class="mr-1">✅</span>
            <span>Data updated successfully</span>
        </span>
    </div>
    
    <!-- Content Container (where HTMX will swap content) -->
    <div :id="targetId || 'live-poll-content'"
         class="live-poll-content"
         @htmx:afterRequest="handleHtmxResponse($event)"
         @htmx:afterSwap="handleHtmxSwap($event)">
        <!-- Initial content will be loaded here -->
    </div>
</div>

<script>
function livePollManager(endpoint, interval = 10, targetId) {
    return {
        endpoint: endpoint,
        targetId: targetId,
        pollingInterval: interval * 1000, // Convert to milliseconds
        isPolling: true,
        isInitialized: false,
        isLoading: false,
        hasError: false,
        errorMessage: '',
        lastUpdate: null,
        showSuccess: false,
        showControls: true,
        pollTimer: null,
        isVisible: true,
        isIdleTime: false,
        statusText: 'Active',
        
        init() {
            // Set up visibility change detection
            document.addEventListener('visibilitychange', () => {
                this.isVisible = !document.hidden;
                this.adjustPollingBasedOnVisibility();
            });
            
            // Set up user activity detection
            this.setupIdleDetection();
            
            // Set up time-based polling adjustment
            this.setupTimeBasedPolling();
            
            this.isInitialized = true;
        },
        
        initPolling() {
            // Wait a bit for DOM to be fully ready
            setTimeout(() => {
                // Initial load
                this.refreshNow();
                
                // Start polling
                this.startPolling();
            }, 100);
        },
        
        startPolling() {
            if (this.pollTimer) {
                clearInterval(this.pollTimer);
            }
            
            if (this.isPolling && this.isVisible && !this.isIdleTime) {
                this.pollTimer = setInterval(() => {
                    if (this.isPolling && this.isVisible && !this.isIdleTime) {
                        this.refreshNow();
                    }
                }, this.pollingInterval);
                
                this.statusText = 'Active';
            }
        },
        
        stopPolling() {
            if (this.pollTimer) {
                clearInterval(this.pollTimer);
                this.pollTimer = null;
            }
            this.statusText = 'Paused';
        },
        
        togglePolling() {
            this.isPolling = !this.isPolling;
            
            if (this.isPolling) {
                this.startPolling();
            } else {
                this.stopPolling();
            }
        },
        
        refreshNow() {
            if (this.isLoading) return;
            
            this.isLoading = true;
            this.hasError = false;
            this.errorMessage = '';
            
            // Wait a bit for DOM to be ready and ensure target element exists
            setTimeout(() => {
                // Ensure targetId is valid and element exists
                const targetSelector = this.targetId ? `#${this.targetId}` : '#live-poll-content';
                const targetElement = document.querySelector(targetSelector);
                
                if (!targetElement) {
                    console.error(`Target element not found: ${targetSelector}`);
                    this.handleError(new Error(`Target element not found: ${targetSelector}`));
                    this.isLoading = false;
                    return;
                }
                
                // Trigger HTMX request
                htmx.ajax('GET', this.endpoint, {
                    target: targetSelector,
                    swap: 'innerHTML',
                    headers: {
                        'X-Live-Poll': 'true'
                    }
                }).then(() => {
                    this.isLoading = false;
                }).catch((error) => {
                    this.handleError(error);
                });
            }, 50);
        },
        
        updatePollingInterval() {
            this.pollingInterval = this.pollingInterval * 1000; // Convert to milliseconds
            
            if (this.isPolling) {
                this.stopPolling();
                this.startPolling();
            }
        },
        
        handleHtmxResponse(event) {
            const xhr = event.detail.xhr;
            
            if (xhr.status === 200) {
                this.lastUpdate = new Date();
                this.hasError = false;
                this.showSuccessNotification();
            } else {
                this.handleError(new Error(`HTTP ${xhr.status}: ${xhr.statusText}`));
            }
            
            this.isLoading = false;
        },
        
        handleHtmxSwap(event) {
            // Add animation classes to updated elements
            const target = event.target;
            const updatedElements = target.querySelectorAll('[data-live-update]');
            
            updatedElements.forEach(element => {
                element.classList.add('live-update-highlight');
                setTimeout(() => {
                    element.classList.remove('live-update-highlight');
                }, 2000);
            });
        },
        
        handleError(error) {
            this.hasError = true;
            this.errorMessage = error.message || 'Failed to update data';
            this.isLoading = false;
            this.statusText = 'Error';
            
            // Retry after delay
            setTimeout(() => {
                if (this.isPolling) {
                    this.refreshNow();
                }
            }, 5000);
        },
        
        showSuccessNotification() {
            this.showSuccess = true;
            setTimeout(() => {
                this.showSuccess = false;
            }, 2000);
        },
        
        adjustPollingBasedOnVisibility() {
            if (this.isVisible) {
                // Tab is visible - resume normal polling
                if (this.isPolling) {
                    this.startPolling();
                }
            } else {
                // Tab is not visible - pause polling
                this.stopPolling();
                this.statusText = 'Tab inactive';
            }
        },
        
        setupIdleDetection() {
            let idleTimer;
            const idleTimeout = 300000; // 5 minutes
            
            const resetIdleTimer = () => {
                this.isIdleTime = false;
                clearTimeout(idleTimer);
                
                idleTimer = setTimeout(() => {
                    this.isIdleTime = true;
                    this.statusText = 'Idle';
                    if (this.isPolling) {
                        this.stopPolling();
                    }
                }, idleTimeout);
            };
            
            // Reset timer on user activity
            ['mousedown', 'keypress', 'scroll', 'touchstart'].forEach(event => {
                document.addEventListener(event, resetIdleTimer, true);
            });
            
            // Initial setup
            resetIdleTimer();
        },
        
        setupTimeBasedPolling() {
            const checkBusinessHours = () => {
                const now = new Date();
                const hour = now.getHours();
                
                // Business hours: 8 AM - 10 PM
                const isBusinessHours = hour >= 8 && hour < 22;
                
                if (isBusinessHours && this.pollingInterval > 10000) {
                    // During business hours, poll more frequently
                    this.pollingInterval = 10000; // 10 seconds
                    if (this.isPolling) {
                        this.stopPolling();
                        this.startPolling();
                    }
                } else if (!isBusinessHours && this.pollingInterval < 30000) {
                    // Outside business hours, poll less frequently
                    this.pollingInterval = 30000; // 30 seconds
                    if (this.isPolling) {
                        this.stopPolling();
                        this.startPolling();
                    }
                }
            };
            
            // Check every hour
            setInterval(checkBusinessHours, 3600000);
            checkBusinessHours(); // Initial check
        },
        
        formatTime(date) {
            if (!date) return '';
            return date.toLocaleTimeString();
        }
    }
}
</script>

<style>
.live-update-highlight {
    animation: liveUpdatePulse 2s ease-in-out;
}

@keyframes liveUpdatePulse {
    0% {
        background-color: rgba(59, 130, 246, 0.1);
        transform: scale(1);
    }
    50% {
        background-color: rgba(59, 130, 246, 0.2);
        transform: scale(1.02);
    }
    100% {
        background-color: transparent;
        transform: scale(1);
    }
}

/* Pulse animation for critical updates */
@keyframes criticalUpdate {
    0%, 100% {
        background-color: rgba(239, 68, 68, 0.1);
    }
    50% {
        background-color: rgba(239, 68, 68, 0.3);
    }
}

.critical-update {
    animation: criticalUpdate 3s ease-in-out infinite;
}

/* Smooth transition for value changes */
.value-change {
    transition: all 0.3s ease-in-out;
}

.value-increase {
    color: #059669;
    font-weight: bold;
}

.value-decrease {
    color: #dc2626;
    font-weight: bold;
}
</style>
